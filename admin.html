<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>포트폴리오 관리자</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <div class="page admin-page">

    <!-- 로그인 -->
    <section class="card admin-card narrow" id="login-card" hidden>
      <h1 class="page-title"><span class="bar"></span>관리자 로그인</h1>
      <p class="guestbook-sub">관리자 이메일과 비밀번호를 입력해 주세요.</p>
      <div class="form-stack">
        <label class="field"><span>이메일</span><input type="email" id="login-email" autocomplete="username"></label>
        <label class="field"><span>비밀번호</span><input type="password" id="login-password" autocomplete="current-password"></label>
        <button type="button" id="login-btn" class="primary-btn tall">로그인</button>
        <p class="form-msg" id="login-msg" role="status"></p>
      </div>
      <p class="back-link"><a href="index.html">← 방문자 화면으로</a></p>
    </section>

    <!-- 관리자가 아닐 때 -->
    <section class="card admin-card narrow" id="denied-card" hidden>
      <h1 class="page-title"><span class="bar"></span>관리자만 쓸 수 있어요</h1>
      <p class="guestbook-sub">이 계정은 관리자로 등록되어 있지 않아요.</p>
      <div class="form-stack">
        <button type="button" id="denied-logout" class="ghost-btn">로그아웃</button>
      </div>
    </section>

    <!-- 관리 화면 -->
    <div id="app" hidden>
      <div class="topbar">
        <h1 class="page-title"><span class="bar"></span>ADMIN</h1>
        <div class="topbar-right">
          <span class="who" id="who"></span>
          <a class="ghost-btn" href="index.html">방문자 화면</a>
          <button type="button" id="logout-btn" class="ghost-btn">로그아웃</button>
        </div>
      </div>

      <section class="card admin-card">
        <h2 class="section-title">프로필</h2>
        <div class="profile-photo-row">
          <div class="photo small" id="photo-preview"></div>
          <div>
            <label class="field"><span>프로필 사진 (이미지, 10MB까지)</span>
              <input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
            <p class="hint-line">사진을 고른 뒤 아래 "프로필 저장"을 눌러야 반영돼요.</p>
          </div>
        </div>
        <div class="form-grid" id="profile-form"></div>
        <div class="actions">
          <button type="button" id="profile-save" class="primary-btn tall">프로필 저장</button>
          <span class="form-msg inline" id="profile-msg" role="status"></span>
        </div>
      </section>

      <section class="card admin-card">
        <h2 class="section-title">포트폴리오 카드</h2>
        <ul class="row-list" id="project-list"></ul>

        <h3 class="sub-title" id="project-form-title">카드 추가</h3>
        <div class="form-grid" id="project-form"></div>
        <div class="actions">
          <button type="button" id="project-save" class="primary-btn tall">카드 저장</button>
          <button type="button" id="project-cancel" class="ghost-btn" hidden>수정 취소</button>
          <span class="form-msg inline" id="project-msg" role="status"></span>
        </div>
      </section>

      <section class="card admin-card">
        <h2 class="section-title">방명록</h2>
        <ul class="row-list" id="gb-admin-list"></ul>
        <p class="form-msg" id="gb-admin-msg" role="status"></p>
      </section>
    </div>

    <p class="loading-note" id="loading" hidden>불러오는 중…</p>
  </div>
  <script src="admin.js"></script>
</body>
</html>
